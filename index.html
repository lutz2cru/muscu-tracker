<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0c0f13">
  <meta name="apple-mobile-web-app-title" content="Muscu">
  <title>Muscu Tracker</title>
  <link rel="stylesheet" href="src/style.css">
</head>
<body>
  <main id="app"><p class="meta">Chargement…</p></main>
  <div id="timer" hidden>
    <div class="t-track"><div class="t-fill"></div></div>
    <div class="t-row">
      <div class="t-txt"><span class="t-label">Repos</span><span class="time"></span></div>
      <button class="btn" data-more>+30 s</button>
      <button class="btn" data-skip>Passer</button>
    </div>
  </div>
  <script type="module" src="src/app.js"></script>
</body>
</html>
